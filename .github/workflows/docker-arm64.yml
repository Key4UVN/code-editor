name: Build ARM64 Docker image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: letranglan129/code-editor

jobs:
  build-arm64:
    name: Build and push ARM64 image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Validate build URLs
        env:
          NEXT_PUBLIC_APP_BASE_URL: ${{ secrets.NEXT_PUBLIC_APP_BASE_URL }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        run: |
          node <<'NODE'
          const names = ['NEXT_PUBLIC_APP_BASE_URL', 'NEXTAUTH_URL']
          let invalid = false

          for (const name of names) {
            const value = process.env[name]?.trim()

            if (!value) {
              console.error(`::error::${name} is empty or unavailable`)
              invalid = true
              continue
            }

            try {
              new URL(value)
              console.log(`${name}: configured and valid`)
            } catch {
              console.error(`::error::${name} is not an absolute URL`)
              invalid = true
            }
          }

          if (invalid) process.exit(1)
          NODE

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_BASE_URL=${{ secrets.NEXT_PUBLIC_APP_BASE_URL }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
            NEXT_PUBLIC_VNP_API=${{ secrets.NEXT_PUBLIC_VNP_API }}
            NEXT_PUBLIC_VNP_RETURNURL=${{ secrets.NEXT_PUBLIC_VNP_RETURNURL }}
            NEXT_PUBLIC_VNP_TMNCODE=${{ secrets.NEXT_PUBLIC_VNP_TMNCODE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
